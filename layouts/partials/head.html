<!-- layouts/partials/head.html -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Título y Metadatos Base -->
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  {{ with site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}
  
  <!-- Carga de Estilos del Tema (Asegúrate de que la ruta sea correcta según tu instalación) -->
  {{ $style := resources.Get "css/hugo-brewm.min.css" }}
  {{ if $style }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}">
  {{ end }}

  <!-- TUS PERSONALIZACIONES DE PRIORIDAD (Override) -->
  <style>
    /* 1. Forzar tamaño de fuente de 8pt de forma global */
    :root {
      --base-font-size: 8pt !important;
    }
    
    html, body {
      font-size: 8pt !important;
    }

    /* 2. Forzar Ancho Completo (Fullwidth) en Escritorio */
    /* Solo para pantallas grandes (Desktop), respetando tu decisión de no tocar móvil */
    @media (min-width: 1024px) {
      /* Aplicar a posts, listas y categorías, excluyendo el Home si ya te gusta */
      body:not(.home) main, 
      body:not(.home) article,
      body:not(.home) .feed-view {
        max-width: 100% !important; 
        width: 100% !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        padding-left: 2rem; /* Margen mínimo opcional para que el texto no toque el borde */
        padding-right: 2rem;
      }

      /* Si usas el tipo 'slide' o 'pin', asegurar que se expandan al máximo [3, 4] */
      .has-crsl, .crsl {
        width: 100vw !important;
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
      }
    }

    /* Ocultar elementos que el usuario podría usar para cambiar tu diseño si ZenMode no fuera suficiente [5] */
    .accessibility-panel-trigger {
      display: none !important; /* Esto oculta el botón del panel de accesibilidad si así lo prefieres */
    }
  </style>

  <!-- Soporte para Pagefind (Buscador) si lo tienes activo [6, 7] -->
  {{ if site.Params.search.pagefind }}
    <link href="/_pagefind/pagefind-ui.css" rel="stylesheet">
    <script src="/_pagefind/pagefind-ui.js"></script>
  {{ end }}
</head>
