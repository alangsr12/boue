    <style>
         
         
         
        #fullscreen {
            --void: calc(1.5rem + 1ex);
        }

        #fullscreen #main-article {
            margin: 0;
            height: var(--vbody);
        }

         
        #focusMode,
         
        #useBionRead,
         
        #to-top {
            display: none !important;
        }

         
        nav#content {
            position: fixed;
            right: var(--void);
            bottom: 0;
            z-index: 3;
            margin: 0;
        }

        nav#content > a {
            display: flex;
            align-items: center;
            padding: 0 1.5ex;
            height: var(--vfoot);
            color: var(--fg);
            font-size: calc(1em - 2pt);
            font-weight: bold;
        }

<details id="has-search" class="presentation js-details" name="on-deck">
    <summary class="on-deck srm" accesskey="q" aria-labelledby="search-label" aria-keyshortcuts="q">
        <span id="search-label" class="t srt">Buscar</span>
    </summary>
    
        <!-- pagefind.html -->
    <div id="search" class="on-hull">
        <div role="presentation" class="screening js-cgpn"></div>
    </div>
    <script src="https://alangsr12.github.io/boue/pagefind/pagefind-ui.js" type="text/javascript"></script>
    <script>
        let pageFindInitialized = false;
        const initPageFind = function(event) {
            if (!pageFindInitialized) {
                new PagefindUI({
                    element: "#search",
                    showImages: false,
                    translations: {
                        placeholder: "Buscar"
                    }
                });
                
                const pFInput = document.querySelector('.pagefind-ui__search-input');
                if (pFInput) {
                    pFInput.setAttribute('aria-label', pFInput.getAttribute('placeholder'));
                    pFInput.setAttribute('name', pFInput.getAttribute('placeholder'));
                }
                pageFindInitialized = true;
                document.removeEventListener('DOMContentLoaded', initPageFind);
            }
        };
        document.addEventListener('DOMContentLoaded', initPageFind);
    </script>

    <form id="duckduckgo" class="form on-plank"
